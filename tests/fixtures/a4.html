<!doctype html>
<!-- Print fixture: declares A4 portrait so print_check can assert geometry. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ligeopersys print fixture</title>
<style>
  @page { size: A4 portrait; margin: 15mm; }
  body { margin: 0; font-family: system-ui, sans-serif; color: #1B2430; }
  main { padding: 4mm; }
  h1 { font-size: 22pt; }
  p { font-size: 11pt; line-height: 1.5; }
</style>
</head>
<body>
  <main>
    <h1>Print geometry sample</h1>
    <p>This page declares A4 portrait in CSS, so print_check asserts the PDF
       MediaBox is 595 x 842 pt and the document prints on exactly one page.</p>
  </main>
</body>
</html>
